name: Experimento xG
on: workflow_dispatch
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Recalibrar la base de tarjetas
        run: |
          exec > data/_diagnostico.log 2>&1
          python -u - <<'PY2'
          import sys; sys.path.insert(0,'scripts')
          import refresh as R; R.prefer_ipv4()
          import numpy as np, pandas as pd
          import stats_engine as SE
          DIVS={"E0":"premier","SP1":"laliga","I1":"seriea","D1":"bundesliga"}
          fr=[]
          for season in ("2627","2526","2425","2324"):
              for div,lg in DIVS.items():
                  d=R.fetch_csv(f"https://www.football-data.co.uk/mmz4281/{season}/{div}.csv")
                  if d is None or "HY" not in d: continue
                  d=d.dropna(subset=["HY","AY"]).copy(); d["lg"]=lg; d["temp"]=season; fr.append(d)
          D=pd.concat(fr,ignore_index=True)
          for c in ("HY","AY","HC","AC","HS","AS","HST","AST"):
              D[c]=pd.to_numeric(D[c],errors="coerce") if c in D else np.nan
          D["savH"]=(D.AST-pd.to_numeric(D.FTAG,errors="coerce")).clip(lower=0)
          D["savA"]=(D.HST-pd.to_numeric(D.FTHG,errors="coerce")).clip(lower=0)
          COLS={"yel":("HY","AY"),"cor":("HC","AC"),"sho":("HS","AS"),"sav":("savH","savA")}
          print("Medias por lado medidas en 2023-2027, contra las que usa el modelo (2018-2025)\n")
          print(f"{'liga':11s} {'stat':5s} {'n':>5s}  {'modelo L/V':>14s}  {'medido L/V':>14s}  {'desvio total':>13s}")
          nuevo={}
          for lg in DIVS.values():
              g=D[D.lg==lg]
              for s,(ch,ca) in COLS.items():
                  sub=g.dropna(subset=[ch,ca])
                  if len(sub)<200: continue
                  mh,ma=sub[ch].mean(),sub[ca].mean()
                  bh,ba=SE.BASE[lg][s]
                  d=(mh+ma)-(bh+ba)
                  flag=" <-- revisar" if abs(d)>0.25 else ""
                  print(f"{lg:11s} {s:5s} {len(sub):5d}  {bh:6.2f}/{ba:5.2f}  {mh:6.2f}/{ma:5.2f}  "
                        f"{d:+8.2f} ({100*d/(bh+ba):+5.1f}%){flag}")
                  nuevo.setdefault(lg,{})[s]=(round(float(mh),2),round(float(ma),2))
          print("\nBASE recalculado:")
          for lg,v in nuevo.items():
              print(f" '{lg}': {{" + ", ".join(f"'{s}':({a},{b})" for s,(a,b) in v.items()) + "},")
          PY2
      - name: Publicar
        if: always()
        run: |
          git config user.name montoglory-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/_diagnostico.log
          git diff --staged --quiet || { git commit -m "experimento xG"; git push; }
