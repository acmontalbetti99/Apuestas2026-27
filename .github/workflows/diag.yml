name: Diagnostico de fuentes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Probar APIs abiertas
        run: |
          exec > data/_diagnostico.log 2>&1
          python -u - <<'PY2'
          import sys; sys.path.insert(0,'scripts')
          import refresh as R; R.prefer_ipv4()
          import requests, json
          s = requests.Session(); s.headers["User-Agent"]="montoglory-probe"

          def probe(name, url, headers=None):
              print(f"\n--- {name}\n    {url}")
              try: r = s.get(url, timeout=25, headers=headers or {})
              except Exception as e: print(f"    EXCEPCION {type(e).__name__}: {e}"); return None
              cf = "Just a moment" in r.text[:400]
              print(f"    http={r.status_code} bytes={len(r.content)} cloudflare={cf}")
              print(f"    cuerpo: {r.text[:260]!r}")
              return None if cf or r.status_code>=400 else r

          print("="*72)
          probe("football-data.org v4 sin token (CL)",
                "https://api.football-data.org/v4/competitions/CL/matches?season=2026")
          probe("API-Football sin key",
                "https://v3.football.api-sports.io/status")
          r = probe("TheSportsDB free: liga CL por temporada",
                "https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4480&s=2026-2027")
          if r:
              d=r.json(); ev=d.get("events") or []
              print(f"    eventos: {len(ev)}")
              if ev:
                  e=ev[0]
                  print(f"    ejemplo: {e.get('strEvent')} {e.get('intHomeScore')}-{e.get('intAwayScore')} {e.get('dateEvent')}")
                  print(f"    campos de stats presentes: {[k for k in e if any(w in k.lower() for w in ('corner','card','shot','save'))] or 'NINGUNO'}")
          r2 = probe("TheSportsDB free: estadisticas de un evento",
                "https://www.thesportsdb.com/api/v1/json/3/lookupeventstats.php?id=2052601")
          PY2
      - name: Publicar
        if: always()
        run: |
          git config user.name montoglory-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/_diagnostico.log
          git diff --staged --quiet || { git commit -m "diagnostico de fuentes"; git push; }
