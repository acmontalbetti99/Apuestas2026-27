name: Diagnostico de fuentes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Probar TheSportsDB con clave 123
        run: |
          exec > data/_diagnostico.log 2>&1
          python -u - <<'PY2'
          import sys; sys.path.insert(0,'scripts')
          import refresh as R; R.prefer_ipv4()
          import requests, json
          s=requests.Session(); s.headers["User-Agent"]="montoglory-probe"
          B="https://www.thesportsdb.com/api/v1/json/123"
          def g(n,u):
              print(f"\n--- {n}\n    {u}")
              try: r=s.get(u,timeout=25)
              except Exception as e: print(f"    EXC {type(e).__name__}: {e}"); return None
              print(f"    http={r.status_code} bytes={len(r.content)}")
              if r.status_code!=200: print(f"    {r.text[:200]!r}"); return None
              try: return r.json()
              except Exception: print(f"    no JSON: {r.text[:200]!r}"); return None

          # 4480 = UEFA Champions League en TheSportsDB
          d=g("CL temporada 2026-2027", f"{B}/eventsseason.php?id=4480&s=2026-2027")
          ev=(d or {}).get("events") or []
          print(f"    eventos: {len(ev)}")
          jugado=None
          for e in ev:
              if e.get("intHomeScore") not in (None,""):
                  jugado=e
          if jugado:
              print(f"    ultimo jugado: {jugado.get('strEvent')} {jugado.get('intHomeScore')}-{jugado.get('intAwayScore')} "
                    f"{jugado.get('dateEvent')} id={jugado.get('idEvent')}")
              st=g("estadisticas de ese partido", f"{B}/lookupeventstats.php?id={jugado['idEvent']}")
              rows=(st or {}).get("eventstats") or []
              print(f"    filas de stats: {len(rows)}")
              for r_ in rows:
                  print(f"      {r_.get('strStat'):28s} local={r_.get('intHome')} visitante={r_.get('intAway')}")
          # tambien ver si cubre las 4 ligas
          for lid,nm in [(4328,"Premier League"),(4335,"La Liga"),(4332,"Serie A"),(4331,"Bundesliga")]:
              d2=g(f"{nm} 2026-2027", f"{B}/eventsseason.php?id={lid}&s=2026-2027")
              n=len((d2 or {}).get("events") or [])
              print(f"    -> {nm}: {n} eventos")
          PY2
      - name: Publicar
        if: always()
        run: |
          git config user.name montoglory-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/_diagnostico.log
          git diff --staged --quiet || { git commit -m "diagnostico de fuentes"; git push; }
