name: Diagnostico de valor
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Mejor precio del mercado contra cuota justa
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          exec > data/_diagnostico.log 2>&1
          python -u - <<'PY2'
          import sys, os; sys.path.insert(0,'scripts')
          import refresh as R; R.prefer_ipv4()
          import requests, numpy as np
          key=os.environ.get("ODDS_API_KEY","")
          if not key: print("sin clave"); raise SystemExit
          s=requests.Session()
          SPORTS={"soccer_uefa_champs_league":"Champions","soccer_uefa_europa_league":"Europa",
                  "soccer_uefa_europa_conference_league":"Conference","soccer_epl":"Premier",
                  "soccer_spain_la_liga":"LaLiga","soccer_italy_serie_a":"SerieA",
                  "soccer_germany_bundesliga":"Bundesliga"}
          def devig(o1,ox,o2):
              i=np.array([1/o1,1/ox,1/o2]); return i/i.sum()
          filas=[]
          for sp,nom in SPORTS.items():
              r=s.get(f"https://api.the-odds-api.com/v4/sports/{sp}/odds",timeout=30,
                      params={"apiKey":key,"regions":"eu,uk","markets":"h2h",
                              "oddsFormat":"decimal","dateFormat":"iso"})
              if r.status_code!=200: continue
              for j in r.json():
                  home,away=j.get("home_team"),j.get("away_team")
                  precios={"1":[],"X":[],"2":[]}
                  devigs=[]
                  for bk in j.get("bookmakers",[]):
                      for m in bk.get("markets",[]):
                          if m.get("key")!="h2h": continue
                          d={o.get("name"):o.get("price") for o in m.get("outcomes",[])}
                          o1,ox,o2=d.get(home),d.get("Draw"),d.get(away)
                          if not all(isinstance(v,(int,float)) and v>1 for v in (o1,ox,o2)): continue
                          precios["1"].append(o1); precios["X"].append(ox); precios["2"].append(o2)
                          devigs.append(devig(o1,ox,o2))
                  if len(devigs)<5: continue
                  cons=np.mean(devigs,axis=0); cons=cons/cons.sum()
                  # mercados simples y dobles, como los que ofrece la app
                  pH,pD,pA=cons
                  opciones=[("1",pH,max(precios["1"])),("2",pA,max(precios["2"])),
                            ("1X",pH+pD,1/(1/max(precios["1"])+1/max(precios["X"]))),
                            ("12",pH+pA,1/(1/max(precios["1"])+1/max(precios["2"]))),
                            ("X2",pD+pA,1/(1/max(precios["X"])+1/max(precios["2"])))]
                  for k,prob,mejor in opciones:
                      if not (0.65<prob<=0.90): continue
                      justa=1/prob
                      filas.append({"comp":nom,"part":f"{home} v {away}","k":k,"p":prob,
                                    "justa":justa,"mejor":mejor,"ev":prob*mejor-1,
                                    "casas":len(devigs)})
          print(f"{len(filas)} selecciones sobre el 65% en {len(SPORTS)} competencias\n")
          if not filas: raise SystemExit
          ev=np.array([f["ev"] for f in filas])
          print(f"valor esperado con el MEJOR precio del mercado:")
          print(f"  media {ev.mean():+.2%}   mediana {np.median(ev):+.2%}")
          print(f"  con valor positivo: {(ev>0).sum()} de {len(ev)} ({100*(ev>0).mean():.0f}%)")
          print(f"  casas consultadas por partido: {np.mean([f['casas'] for f in filas]):.0f}\n")
          print("  las 10 mejores:")
          for f in sorted(filas,key=lambda x:-x["ev"])[:10]:
              print(f"    {f['ev']:+6.2%}  p={f['p']:.0%}  justa {f['justa']:.2f}  mejor {f['mejor']:.2f}  "
                    f"[{f['comp']:10s}] {f['part'][:38]:38s} {f['k']}")
          print("\n  por banda de probabilidad:")
          for a,b in ((0.65,0.75),(0.75,0.85),(0.85,0.91)):
              s_=[f for f in filas if a<=f["p"]<b]
              if not s_: continue
              e=np.array([f["ev"] for f in s_])
              print(f"    {a:.0%}-{b:.0%}: n={len(s_):3d}  EV medio {e.mean():+.2%}  "
                    f"positivos {100*(e>0).mean():3.0f}%  cuota media {np.mean([f['mejor'] for f in s_]):.2f}")
          PY2
      - name: Publicar
        if: always()
        run: |
          git config user.name montoglory-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/_diagnostico.log
          git diff --staged --quiet || { git commit -m "diag valor"; git push; }
