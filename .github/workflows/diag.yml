name: Diagnostico de esquema
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Volcar esquemas
        run: |
          exec > data/_diagnostico.log 2>&1
          python -u - <<'PY'
          import sys; sys.path.insert(0,'scripts')
          import refresh as R
          R.prefer_ipv4()
          for url in ("https://www.football-data.co.uk/fixtures.csv",
                      "https://www.football-data.co.uk/mmz4281/2627/E0.csv"):
              print("="*70); print(url)
              d = R.fetch_csv(url)
              if d is None: print("  no bajo"); continue
              print(f"  filas={len(d)}")
              print(f"  columnas ({len(d.columns)}): {list(d.columns)}")
              print("  primeras 3 filas:")
              import pandas as pd
              pd.set_option("display.width", 250, "display.max_columns", 60)
              print(d.head(3).to_string())
              print("  columnas de cuotas presentes:")
              for s in R.ODDS_SETS:
                  print("   ", s, all(c in d.columns for c in s))
          PY
      - name: Publicar
        if: always()
        run: |
          git config user.name montoglory-bot
          git config user.email actions@users.noreply.github.com
          git add -A data/_diagnostico.log
          git diff --staged --quiet || { git commit -m "diagnostico de esquema"; git push; }
