# Refresco diario: liquida los partidos terminados, mide el acierto, mueve el umbral
# si hace falta y genera los picks de lo que viene. Commitea data/*.json; cuando el
# proyecto de Vercel este conectado a este repo, el commit dispara el redeploy solo.
name: Refresco diario
on:
  schedule:
    - cron: '50 10 * * *'   # 05:50 Lima
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresco
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Liquidar y regenerar
        run: |
          set -o pipefail
          python -u scripts/refresh.py 2>&1 | tee data/_ultimo_refresco.log
      - name: Commitear si cambio algo
        if: always()
        run: |
          git config user.name  "montoglory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: refresco $(date -u +%Y-%m-%d)"
            git push
          fi
