# Dos cadencias, porque las fuentes tienen tiempos distintos.
#
# Cada 30 minutos (13:00-23:30 UTC, que cubre el final de todo el futbol europeo):
#   LiveScore trae el marcador apenas termina el partido, asi que los picks de
#   resultado y goles se liquidan el mismo dia. Solo liquida: no regenera picks,
#   porque la ventana de fixtures.csv cambia una vez al dia y rearmarlos cada
#   media hora haria bailar las recomendaciones.
#
# Una vez al dia (10:50 UTC = 05:50 Lima):
#   La corrida completa. football-data publica con horas de retraso pero es la
#   unica que trae cornners, tarjetas, remates y atajadas, y es de donde salen
#   las cuotas de cierre con las que se generan los picks nuevos.
name: Refresco
on:
  schedule:
    - cron: '50 10 * * *'        # completa
    - cron: '*/30 13-23 * * *'   # solo liquidar
  workflow_dispatch:
    inputs:
      completa:
        description: 'Correr la completa (regenera picks), no solo liquidar'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: refresco
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decidir el modo
        id: modo
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 13-23 * * *" ] \
             || [ "${{ github.event.inputs.completa }}" = "false" ]; then
            echo "args=--solo-liquidar" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # Cuotas de las competencias UEFA. Sin el secret ODDS_API_KEY no hace nada
      # y el resto sigue igual, solo que Champions/Europa/Conference no generan picks.
      - name: Cuotas UEFA
        continue-on-error: true
        if: steps.modo.outputs.args == ''
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -u scripts/odds_api.py 2>&1 | tee data/_ultimo_odds.log

      # Si LiveScore falla, la liquidacion sigue con football-data y con lo que
      # ya estuviera en resultados_extra.json.
      - name: Resultados en vivo
        continue-on-error: true
        run: python -u scripts/livescore.py 2>&1 | tee data/_ultimo_livescore.log

      - name: Liquidar y regenerar
        run: |
          set -o pipefail
          python -u scripts/refresh.py ${{ steps.modo.outputs.args }} 2>&1 \
            | tee data/_ultimo_refresco.log

      # Mide integridad, liquidacion, calibracion, valor, frescura y el sitio.
      # No bloquea el commit: primero se guarda el informe, despues se pone en rojo.
      - name: Auditoria
        id: audit
        if: steps.modo.outputs.args == ''
        continue-on-error: true
        run: python -u scripts/auditoria.py 2>&1 | tee data/_ultima_auditoria.log

      - name: Commitear si cambio algo
        if: always()
        run: |
          git config user.name  "montoglory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ AUDITORIA.md
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: ${{ steps.modo.outputs.args && 'liquidacion' || 'refresco' }} $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Va en rojo si la auditoria encontro algo de severidad alta, pero recien
      # ahora, con el informe ya commiteado y visible en AUDITORIA.md.
      - name: Fallar si la auditoria encontro algo grave
        if: steps.audit.outcome == 'failure'
        run: |
          echo "La auditoria encontro hallazgos de severidad alta. Ver AUDITORIA.md"
          exit 1
