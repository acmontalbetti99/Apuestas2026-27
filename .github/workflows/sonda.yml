# Sonda manual, no toca nada: averigua si la fuente de resultados expone
# estadisticas de partido (cornners, tarjetas, remates) para los torneos.
name: Sonda de estadisticas
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/sonda_stats.py
