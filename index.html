<title>Montoglory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a betting ledger — sticky scoreboard header, tab strip, rows that read like slip lines. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --sunk:#edebe6;
  --fg:#1b1a17; --fg-dim:#6d6a62; --fg-faint:#96928a;
  --line:#dedbd4; --line-strong:#c6c2b8;
  --accent:#b3561a; --accent-soft:#f3e2d4;
  --good:#1f6b4a; --good-soft:#dcece3;
  --bad:#a32b2b; --bad-soft:#f4dede;
  --wait:#7a6a2f; --wait-soft:#f0ead2;
  --font-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13130f; --surface:#1c1c18; --sunk:#232320;
  --fg:#f0eee8; --fg-dim:#a5a199; --fg-faint:#767269;
  --line:#2e2e29; --line-strong:#41403a;
  --accent:#e08445; --accent-soft:#3a271a;
  --good:#5bc08d; --good-soft:#182c22;
  --bad:#e07878; --bad-soft:#331a1a;
  --wait:#d6c06a; --wait-soft:#2c2718;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13130f; --surface:#1c1c18; --sunk:#232320;
  --fg:#f0eee8; --fg-dim:#a5a199; --fg-faint:#767269;
  --line:#2e2e29; --line-strong:#41403a;
  --accent:#e08445; --accent-soft:#3a271a;
  --good:#5bc08d; --good-soft:#182c22;
  --bad:#e07878; --bad-soft:#331a1a;
  --wait:#d6c06a; --wait-soft:#2c2718;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:auto}
.brand h1{font-size:21px;font-weight:700}
.brand span{font-size:11.5px;color:var(--fg-dim);letter-spacing:.02em}
.scoreboard{display:flex;gap:10px;flex-wrap:wrap}
.sb{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 11px;min-width:88px}
.sb b{display:block;font-family:var(--font-mono);font-size:17px;font-weight:600;line-height:1.2}
.sb small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint);margin-top:2px}
.sb.on b{color:var(--good)}

/* tabs */
nav{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg-dim);
  font-family:var(--font-display);font-size:13px;font-weight:600;padding:10px 13px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:20px 56px}
.lead{color:var(--fg-dim);font-size:13.5px;max-width:64ch;margin:0 0 18px}
.lead b{color:var(--fg);font-weight:600}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--fg-dim);
  font-family:var(--font-body);font-size:12px;font-weight:500;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#13130f}}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* day group */
.day{font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fg-faint);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day:first-child{margin-top:0}

/* pick row */
.pick{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px}
.pick.won{border-left:3px solid var(--good)}
.pick.lost{border-left:3px solid var(--bad)}
.prob{text-align:center}
.prob b{font-family:var(--font-mono);font-size:16px;font-weight:600;display:block;line-height:1.1}
.meter{height:3px;background:var(--sunk);border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.mid{min-width:0}
.match{font-size:14px;font-weight:600;line-height:1.25}
.match em{font-style:normal;color:var(--fg-dim);font-weight:400;padding:0 3px}
.meta{font-size:11.5px;color:var(--fg-faint);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bet{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;
  font-size:12px;font-weight:600;padding:2px 8px;margin-top:5px}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.odds{font-family:var(--font-mono);font-size:15px;font-weight:600}
.odds small{display:block;font-size:9px;font-family:var(--font-body);font-weight:400;color:var(--fg-faint);
  text-transform:uppercase;letter-spacing:.06em}
.tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 7px}
.tag.won{background:var(--good-soft);color:var(--good)}
.tag.lost{background:var(--bad-soft);color:var(--bad)}
.tag.pend{background:var(--wait-soft);color:var(--wait)}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;overflow:hidden;margin-bottom:16px}
.thead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--sunk);
  padding:11px 14px;border-bottom:1px solid var(--line)}
.thead h3{font-size:14px;font-weight:700;margin-right:auto}
.thead .k{font-family:var(--font-mono);font-size:13px;font-weight:600}
.thead .k small{font-family:var(--font-body);font-size:10px;color:var(--fg-faint);
  text-transform:uppercase;letter-spacing:.06em;margin-right:4px;font-weight:400}
.leg{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 14px;
  border-bottom:1px solid var(--line);font-size:13px}
.leg:last-child{border-bottom:none}
.leg .lp{font-family:var(--font-mono);font-size:12.5px;color:var(--fg-dim)}
.leg .lm{min-width:0}
.leg .lm b{display:block;font-weight:600;font-size:13px}
.leg .lm span{color:var(--fg-dim);font-size:11.5px}

/* table */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}
th,td{text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--font-display);font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--fg-faint);background:var(--sunk)}
tr:last-child td{border-bottom:none}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.delta{font-family:var(--font-mono);font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* calibration bar */
.calrow{display:grid;grid-template-columns:76px 1fr 56px;gap:12px;align-items:center;margin-bottom:9px;font-size:12.5px}
.calbar{position:relative;height:20px;background:var(--sunk);border-radius:4px;overflow:hidden}
.calbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.3}
.calbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);text-decoration:none}
.callbl{font-family:var(--font-mono);text-align:right;font-size:12px}

.empty{border:1px dashed var(--line-strong);border-radius:11px;padding:30px 22px;text-align:center;color:var(--fg-dim)}
.empty h3{font-size:15px;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13px;margin:0 auto;max-width:46ch}
.note{font-size:12px;color:var(--fg-faint);margin-top:16px;max-width:70ch;border-top:1px solid var(--line);padding-top:12px}
.note b{color:var(--fg-dim)}
@media (max-width:560px){
  .pick{grid-template-columns:46px 1fr;row-gap:8px}
  .right{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .hrow{padding-block:11px}
  .sb{min-width:76px;padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">
        <h1>Montoglory</h1>
        <span id="sub">Premier · La Liga · Serie A · Bundesliga</span>
      </div>
      <div class="scoreboard" id="scoreboard"></div>
    </div>
    <nav id="tabs" role="tablist">
      <button role="tab" data-t="picks" aria-selected="true">Picks</button>
      <button role="tab" data-t="combis" aria-selected="false">Combinadas</button>
      <button role="tab" data-t="historial" aria-selected="false">Historial</button>
      <button role="tab" data-t="precision" aria-selected="false">Precisión</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="p-picks"></section>
  <section id="p-combis" hidden></section>
  <section id="p-historial" hidden></section>
  <section id="p-precision" hidden></section>
</main>

<script>
const LG={premier:'Premier League',laliga:'La Liga',seriea:'Serie A',bundesliga:'Bundesliga',ucl:'Champions League'};
const GRP={resultado:'Resultado',goles:'Goles',estadisticas:'Córners, tarjetas, remates y atajadas'};
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let PICKS=[],TICKETS=[],league='todas',grupo='todos',tab='picks',ready=false;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=p=>(100*p).toFixed(1)+'%';
const dkey=iso=>{const d=new Date(iso);return d.toISOString().slice(0,10)};
const dlabel=iso=>{const d=new Date(iso);return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const tlabel=iso=>{const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const st=p=>p.estado==='ganado'?'won':p.estado==='perdido'?'lost':'pend';
const stw=p=>p.estado==='ganado'?'Acertó':p.estado==='perdido'?'Falló':'Pendiente';

function scoreboard(){
  const done=PICKS.filter(p=>p.estado==='ganado'||p.estado==='perdido');
  const won=done.filter(p=>p.estado==='ganado').length;
  const pred=done.length?done.reduce((s,p)=>s+p.p,0)/done.length:0;
  const real=done.length?won/done.length:0;
  const pend=PICKS.filter(p=>p.estado==='pendiente').length;
  const tk=TICKETS.filter(t=>t.estado==='ganado'||t.estado==='perdido');
  const tkw=tk.filter(t=>t.estado==='ganado').length;
  const cells=[
    ['Pendientes',pend,false],
    ['Liquidadas',done.length,false],
    ['Acierto real',done.length?pc(real):'—',done.length>0&&real>=pred],
    ['Predicho',done.length?pc(pred):'—',false],
    ['Combinadas',tk.length?`${tkw}/${tk.length}`:'—',false]
  ];
  document.getElementById('scoreboard').innerHTML=cells.map(([l,v,on])=>
    `<div class="sb${on?' on':''}"><b class="num">${esc(v)}</b><small>${esc(l)}</small></div>`).join('');
}

function filters(withGroup){
  const ls=['todas',...Object.keys(LG)];
  let h=`<div class="filters">${ls.map(l=>
    `<button class="chip" data-lg="${l}" aria-pressed="${league===l?'true':'false'}">${l==='todas'?'Todas':LG[l]}</button>`).join('')}</div>`;
  if(withGroup){
    const gs=[['todos','Todos los mercados'],...Object.entries(GRP)];
    h+=`<div class="filters">${gs.map(([k,n])=>
      `<button class="chip" data-gr="${k}" aria-pressed="${grupo===k?'true':'false'}">${n}</button>`).join('')}</div>`;
  }
  return h;
}
const inView=p=>(league==='todas'||p.lg===league)&&(grupo==='todos'||p.grupo===grupo);

function pickRow(p,showRes){
  const res=showRes&&p.resultado?`<span class="num">${esc(p.resultado)}</span>`:'';
  return `<article class="pick ${st(p)==='pend'?'':st(p)}">
    <div class="prob"><b class="num">${(100*p.p).toFixed(0)}<span style="font-size:11px">%</span></b>
      <div class="meter"><i style="width:${Math.round(100*p.p)}%"></i></div></div>
    <div class="mid">
      <div class="match">${esc(p.home)}<em>v</em>${esc(p.away)}</div>
      <div class="meta"><span>${esc(LG[p.lg]||p.lg)}</span><span>·</span><span>${esc(dlabel(p.ko))} ${esc(tlabel(p.ko))}</span>${p.cat?'<span>·</span><span>'+esc(p.cat)+'</span>':''}${res?'<span>·</span>'+res:''}</div>
      <span class="bet">${esc(p.label)}</span>
    </div>
    <div class="right">
      <span class="odds num">${p.cuota.toFixed(2)}<small>cuota justa</small></span>
      <span class="tag ${st(p)}">${stw(p)}</span>
    </div></article>`;
}

function renderPicks(){
  const el=document.getElementById('p-picks');
  const open=PICKS.filter(p=>p.estado==='pendiente'&&inView(p))
                  .sort((a,b)=>new Date(a.ko)-new Date(b.ko)||b.p-a.p);
  if(!ready){el.innerHTML=skeleton('Cargando los picks de la jornada…');return}
  let h=`<p class="lead">Solo se recomienda lo que el modelo da por encima del <b>65%</b>. Hasta tres picks por partido, uno por familia de mercado, para que no se solapen. La <b>cuota justa</b> es el precio a partir del cual la apuesta deja de perder valor: si la casa paga menos que eso, no la tomes.</p>`+filters(true);
  if(!open.length){
    h+=`<div class="empty"><h3>No hay picks abiertos</h3><p>Cuando se carguen los partidos de la próxima jornada, acá aparecen las recomendaciones que superan el 65%.</p></div>`;
  }else{
    let last='';
    for(const p of open){
      const k=dkey(p.ko);
      if(k!==last){h+=`<div class="day">${esc(dlabel(p.ko))}</div>`;last=k}
      h+=pickRow(p,false);
    }
  }
  h+=`<p class="note"><b>Cómo se calcula.</b> El 1X2 sale del mercado, que sobre 7.149 partidos le gana a cualquier modelo propio. Los goles salen de una superficie Dixon-Coles ajustada para que coincida con la media de la liga y con el reparto del mercado. Córners, tarjetas, remates y atajadas salen de una binomial negativa por lado, corregida por el desequilibrio del partido: un local muy favorito saca 6,78 córners de media contra 3,38 del rival, y 16,94 remates contra 8,66.<br><br><b>Qué dio en la prueba.</b> Sobre 7.229 partidos reales: los picks de resultado y goles cayeron el <b>80,5%</b> contra un 79,8% predicho; los de córners, tarjetas, remates y atajadas cayeron el <b>75,9%</b> contra un 76,3% predicho, ya con la corrección de calibración aplicada.<br><br><b>Champions League.</b> Mi base histórica no tiene partidos de Champions, así que ahí solo se ofrecen resultado y doble oportunidad, que salen directo del mercado y no dependen de esa base. Córners, tarjetas, remates y atajadas no aparecen para Champions hasta tener con qué calibrarlos.</p>`;
  el.innerHTML=h;
}

function renderCombis(){
  const el=document.getElementById('p-combis');
  if(!ready){el.innerHTML=skeleton('Cargando combinadas…');return}
  const open=TICKETS.filter(t=>t.estado==='pendiente');
  let h=`<p class="lead">Combinadas armadas para caer entre el <b>40% y el 52%</b> de probabilidad conjunta: es la zona donde la cuota compensa sin que el riesgo se dispare. Una sola pata por partido, para que las probabilidades se puedan multiplicar sin correlación.</p>`;
  if(!open.length){
    h+=`<div class="empty"><h3>No hay combinadas abiertas</h3><p>Se arman cuando hay suficientes picks sobre 65% en la jornada como para llegar al 40% conjunto.</p></div>`;
  }
  for(const t of open){
    h+=`<div class="ticket"><div class="thead"><h3>${t.patas} patas</h3>
      <span class="k"><small>Probabilidad</small>${pc(t.prob)}</span>
      <span class="k"><small>Cuota justa</small>${t.cuota.toFixed(2)}</span></div>`;
    for(const l of t.legs){
      h+=`<div class="leg"><span class="lp">${(100*l.p).toFixed(0)}%</span>
        <div class="lm"><b>${esc(l.home)} v ${esc(l.away)}</b><span>${esc(LG[l.lg]||l.liga||'')} · ${esc(l.label)}</span></div>
        <span class="num" style="font-size:12.5px;color:var(--fg-dim)">${l.cuota?l.cuota.toFixed(2):''}</span></div>`;
    }
    h+='</div>';
  }
  h+=`<p class="note"><b>Qué esperar.</b> Sobre 2.625 combinadas simuladas con este mismo criterio, el acierto real fue <b>48,0%</b> contra un <b>47,2%</b> predicho. Para ganar plata con ellas la casa tiene que pagarte por encima de la cuota justa que figura arriba; si paga menos, la combinada pierde valor aunque entre.</p>`;
  el.innerHTML=h;
}

function renderHistorial(){
  const el=document.getElementById('p-historial');
  if(!ready){el.innerHTML=skeleton('Cargando historial…');return}
  const done=PICKS.filter(p=>p.estado!=='pendiente'&&inView(p))
                  .sort((a,b)=>new Date(b.ko)-new Date(a.ko));
  let h=`<p class="lead">Cada pick que se recomendó, liquidado contra el resultado real. Esta es la base con la que se mide el acierto y se ajustan las sugerencias.</p>`+filters(true);
  if(!done.length){
    h+=`<div class="empty"><h3>Todavía no hay nada liquidado</h3><p>Los picks pasan acá en cuanto termina el partido. El refresco diario los liquida y recalcula el acierto.</p></div>`;
  }else{
    let last='';
    for(const p of done){
      const k=dkey(p.ko);
      if(k!==last){h+=`<div class="day">${esc(dlabel(p.ko))}</div>`;last=k}
      h+=pickRow(p,true);
    }
  }
  el.innerHTML=h;
}

function renderPrecision(){
  const el=document.getElementById('p-precision');
  if(!ready){el.innerHTML=skeleton('Cargando precisión…');return}
  const done=PICKS.filter(p=>p.estado==='ganado'||p.estado==='perdido');
  let h=`<p class="lead">El punto de esta pantalla es simple: si el modelo dice 75%, tiene que entrar 75 de cada 100 veces. Cuando se desvía de forma consistente, los umbrales se corrigen con lo medido acá.</p>`;
  if(done.length<10){
    h+=`<div class="empty"><h3>Faltan partidos para medir</h3>
      <p>Hay ${done.length} ${done.length===1?'pick liquidado':'picks liquidados'}. Con menos de 10 cualquier porcentaje es ruido. La referencia de arranque, medida sobre 7.229 partidos históricos, es <b>80,5% real</b> contra <b>79,8% predicho</b>.</p></div>`;
  }else{
    const won=done.filter(p=>p.estado==='ganado').length;
    const pred=done.reduce((s,p)=>s+p.p,0)/done.length, real=won/done.length;
    const se=Math.sqrt(real*(1-real)/done.length), gap=100*(real-pred);
    h+=`<div class="scroll" style="margin-bottom:18px"><table><thead><tr>
      <th>Resumen</th><th>Picks</th><th>Predicho</th><th>Real</th><th>Desvío</th></tr></thead><tbody>
      <tr><td>Todas las ligas</td><td class="n">${done.length}</td><td class="n">${pc(pred)}</td>
      <td class="n">${pc(real)}</td><td class="n delta ${gap>=0?'up':'down'}">${gap>=0?'+':''}${gap.toFixed(1)} pp</td></tr>`;
    for(const [k,n] of [...Object.entries(LG),...Object.entries(GRP).map(([a,b])=>['grupo:'+a,b])]){
      const s=k.startsWith('grupo:')?done.filter(p=>p.grupo===k.slice(6)):done.filter(p=>p.lg===k);
      if(!s.length)continue;
      const w=s.filter(p=>p.estado==='ganado').length, pp=s.reduce((a,p)=>a+p.p,0)/s.length, rr=w/s.length, g=100*(rr-pp);
      h+=`<tr><td>${esc(n)}</td><td class="n">${s.length}</td><td class="n">${pc(pp)}</td>
        <td class="n">${pc(rr)}</td><td class="n delta ${g>=0?'up':'down'}">${g>=0?'+':''}${g.toFixed(1)} pp</td></tr>`;
    }
    h+='</tbody></table></div>';
    h+=`<h3 style="font-size:14px;margin-bottom:4px">Calibración por banda</h3>
        <p class="lead" style="margin-bottom:14px">La barra es lo que entró; la línea vertical es lo que el modelo había prometido. Cuanto más pegadas, mejor calibrado.</p>`;
    const bands=[[.65,.70],[.70,.75],[.75,.80],[.80,.85],[.85,.90],[.90,1.01]];
    let any=false;
    for(const [lo,hi] of bands){
      const s=done.filter(p=>p.p>=lo&&p.p<hi); if(s.length<3)continue; any=true;
      const w=s.filter(p=>p.estado==='ganado').length, rr=w/s.length, pp=s.reduce((a,p)=>a+p.p,0)/s.length;
      h+=`<div class="calrow"><span class="num" style="color:var(--fg-dim)">${(100*lo).toFixed(0)}–${(100*Math.min(hi,1)).toFixed(0)}%</span>
        <div class="calbar" title="n=${s.length}"><i style="width:${(100*rr).toFixed(1)}%"></i><u style="left:calc(${(100*pp).toFixed(1)}% - 1px)"></u></div>
        <span class="callbl">${(100*rr).toFixed(0)}% · ${s.length}</span></div>`;
    }
    if(!any)h+=`<p class="lead">Todavía no hay 3 picks liquidados en ninguna banda.</p>`;
    h+=`<p class="note"><b>Cómo se ajusta.</b> Con 60 o más picks liquidados, el desvío medido se descuenta de las probabilidades antes de aplicar el filtro del 65%: si el modelo viene inflado 3 puntos, el umbral efectivo sube a 68% y pasan menos picks. Con menos de 60 no se toca nada, porque el error de muestra es mayor que el ajuste.</p>`;
  }
  el.innerHTML=h;
}

function skeleton(msg){return `<div class="empty"><h3>${esc(msg)}</h3><p>Si no aparece nada en unos segundos, es que esta vista no tiene acceso a los datos guardados.</p></div>`}

/* Two homes, one page. On Vercel the data is versioned JSON in the repo, which the
   daily refresh commits; inside the Claude artifact it is the artifact's own database,
   which the same refresh writes to. Whichever answers first wins. */
async function fromFiles(){
  const [p,t]=await Promise.all([
    fetch('data/picks.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch('data/parlays.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  if(!Array.isArray(p))return false;
  PICKS=p.filter(x=>x&&x.ko); TICKETS=Array.isArray(t)?t.filter(x=>x&&x.legs):[];
  return true;
}
(async()=>{
  if(await fromFiles()){ready=true;render();return}
  const db=await window.claude?.use?.('db');
  if(!db){ready=true;render();return}
  let gotP=false,gotT=false;
  db.collection('picks').onSnapshot(snap=>{
    PICKS=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p&&p.ko);
    gotP=true; if(gotP&&gotT)ready=true; render();
  },()=>{ready=true;render()});
  db.collection('parlays').onSnapshot(snap=>{
    TICKETS=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t&&t.legs);
    gotT=true; if(gotP&&gotT)ready=true; render();
  },()=>{ready=true;render()});
  setTimeout(()=>{if(!ready){ready=true;render()}},6000);
})();
</script>
